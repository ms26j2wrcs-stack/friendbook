<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211E3B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="好友记">
<meta name="mobile-web-app-capable" content="yes">
<title>好友记 · 通讯录</title>
<style>
/* ============ 设计变量 ============ */
:root{
  --ink:#15151B;
  --ink-2:#43434F;
  --muted:#8B8B96;
  --line:rgba(21,21,27,.07);
  --bg:#F4F5F9;
  --card:#FFFFFF;
  --accent:#5B5BD6;
  --accent-2:#8A63E8;
  --income:#12A150;
  --expense:#E5484D;
  --shadow:0 1px 2px rgba(21,21,27,.04), 0 10px 26px -16px rgba(21,21,27,.28);
  --ease:cubic-bezier(.32,.72,0,1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:radial-gradient(120% 80% at 50% -10%,#2A2A40 0%,#17171D 45%,#0C0C10 100%);
  display:grid;
  place-items:center;
  min-height:100dvh;
  padding:36px 16px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid #8A63E8;outline-offset:2px;border-radius:8px}
[hidden]{display:none !important}

.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ============ 手机外框 ============ */
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.phone{
  position:relative;
  width:390px;
  height:844px;
  background:var(--bg);
  border-radius:44px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:
    0 0 0 10px #1B1B21,
    0 0 0 11px #33333E,
    0 0 0 12px rgba(0,0,0,.4),
    0 50px 90px -30px rgba(0,0,0,.85);
}
.caption{
  margin:0;
  font-size:12px;
  letter-spacing:.2px;
  color:rgba(255,255,255,.34);
  text-align:center;
  line-height:1.6;
}
.caption b{color:rgba(255,255,255,.6);font-weight:600}

/* ============ 屏幕切换 ============ */
.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  overflow:hidden;
}
.screen-detail{
  z-index:5;
  transform:translateX(100%);
  transition:transform .42s var(--ease);
  box-shadow:-18px 0 40px rgba(0,0,0,.22);
}
.phone.detail-open .screen-detail{transform:translateX(0)}

/* ============ 通讯录列表 ============ */
.list-head{
  position:relative;
  z-index:3;
  flex:none;
  padding:0 18px 52px;
  color:#fff;
  background:
    radial-gradient(58% 52% at 92% -8%, rgba(155,107,255,.6) 0%, rgba(155,107,255,0) 70%),
    radial-gradient(52% 58% at -6% 112%, rgba(255,122,89,.38) 0%, rgba(255,122,89,0) 70%),
    linear-gradient(158deg,#211E3B 0%,#312A66 46%,#4A3AA6 100%);
}
.list-head > *{position:relative;z-index:1}

.statusbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-top:14px;
  font-size:12.5px;
  font-weight:650;
  letter-spacing:.3px;
  color:rgba(255,255,255,.9);
}
.sb-right{display:flex;align-items:center;gap:6px}
.sb-5g{font-size:10.5px;letter-spacing:.6px;color:rgba(255,255,255,.72)}
.battery{
  position:relative;
  width:22px;height:11px;
  border:1.2px solid rgba(255,255,255,.55);
  border-radius:3.5px;
}
.battery::before{
  content:"";
  position:absolute;
  inset:1.5px 5px 1.5px 1.5px;
  background:rgba(255,255,255,.9);
  border-radius:1.5px;
}
.battery::after{
  content:"";
  position:absolute;
  right:-3.4px;top:3px;
  width:2px;height:5px;
  background:rgba(255,255,255,.5);
  border-radius:0 2px 2px 0;
}

.list-head-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  margin-top:18px;
}
.list-head h1{
  margin:0;
  font-size:27px;
  font-weight:700;
  letter-spacing:.6px;
}
.list-head p{
  margin:5px 0 0;
  font-size:11.5px;
  color:rgba(255,255,255,.58);
  letter-spacing:.3px;
}
.round-btn{
  width:34px;height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#fff;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.12);
  transition:background .2s, transform .15s;
}
.round-btn:hover{background:rgba(255,255,255,.24)}
.round-btn:active{transform:scale(.94)}
.round-btn .ico{width:17px;height:17px;stroke-width:2.1}

.search{
  position:absolute;
  left:18px;right:18px;bottom:-20px;
  z-index:2;
  height:40px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
  border-radius:13px;
  background:#fff;
  box-shadow:0 6px 16px -10px rgba(21,21,27,.38);
}
.search .ico{width:15px;height:15px;color:#A0A0AC}
.search input{
  flex:1;
  min-width:0;
  border:none;
  outline:none;
  background:none;
  font-family:inherit;
  font-size:13.5px;
  color:var(--ink);
}
.search input::placeholder{color:#B4B4C0}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}

.list-scroll{
  position:relative;
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  background:#fff;
  padding-top:30px;
  scrollbar-width:none;
}
.list-scroll::-webkit-scrollbar{width:0}

.group-letter{
  position:sticky;
  top:0;
  z-index:1;
  padding:4px 18px;
  background:#F4F5F9;
  font-size:10.5px;
  font-weight:650;
  letter-spacing:.8px;
  color:var(--muted);
}
.c-row{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:9px 24px 9px 18px;
  background:#fff;
  text-align:left;
  transition:background .15s;
}
.c-row::after{
  content:"";
  position:absolute;
  left:70px;right:0;bottom:0;
  height:1px;
  background:var(--line);
}
.c-swipe:last-child .c-row::after{display:none}
.c-row:active{background:#F7F7FB}

/* 列表左滑操作 */
.c-swipe{position:relative;overflow:hidden;background:#fff}
.c-swipe .c-row{
  position:relative;
  z-index:1;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
.c-actions{
  position:absolute;
  top:0;right:0;bottom:0;
  z-index:2;
  display:flex;
  transform:translateX(144px);
  transition:transform .24s var(--ease);
  box-shadow:-10px 0 20px -10px rgba(21,21,27,.45);
}
.c-swipe.dragging .c-actions{transition:none}
.c-act{
  width:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:600;
  letter-spacing:.5px;
  color:#fff;
}
.c-act.edit{background:#5B5BD6}
.c-act.del{background:#E5484D}
.screen-list.swiping .index-bar{opacity:0;pointer-events:none}
.index-bar{transition:opacity .2s}
.c-avatar{
  width:42px;height:42px;
  flex:none;
  border-radius:14px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:17px;
  font-weight:600;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
}
.c-main{flex:1;min-width:0}
.c-name{display:block;font-size:15.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-name i{font-style:normal;font-size:11.5px;font-weight:450;color:var(--muted);margin-left:6px}
.c-sub{
  display:block;
  margin-top:2px;
  font-size:11.5px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.list-empty{
  padding:56px 20px;
  text-align:center;
  font-size:13px;
  color:var(--muted);
}
.index-bar{
  position:absolute;
  right:3px;top:50%;
  transform:translateY(-50%);
  z-index:3;
  display:flex;
  flex-direction:column;
  gap:1px;
}
.index-bar button{
  width:18px;height:16px;
  font-size:9.5px;
  font-weight:650;
  color:var(--accent);
  border-radius:5px;
}
.index-bar button:active{background:rgba(91,91,214,.12)}

/* ============ 详情头部 ============ */
.hero{
  position:relative;
  flex:none;
  padding:0 18px 46px;
  color:#fff;
  background:linear-gradient(158deg,#211E3B 0%,#312A66 46%,#4A3AA6 100%);
  overflow:hidden;
}
.hero::before{
  content:"";
  position:absolute;
  top:-120px;right:-90px;
  width:320px;height:320px;
  background:radial-gradient(circle,#9B6BFF 0%,rgba(155,107,255,0) 68%);
  opacity:.6;
}
.hero::after{
  content:"";
  position:absolute;
  left:-90px;bottom:-140px;
  width:260px;height:260px;
  border-radius:50%;
  background:radial-gradient(circle,#FF7A59 0%,rgba(255,122,89,0) 68%);
  opacity:.42;
}
.hero > *{position:relative;z-index:1}

.nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.nav-btn{
  display:inline-flex;
  align-items:center;
  gap:3px;
  height:30px;
  padding:0 11px 0 8px;
  border-radius:999px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  font-size:12.5px;
  font-weight:550;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  transition:background .2s, transform .15s;
}
.nav-btn:hover{background:rgba(255,255,255,.2)}
.nav-btn:active{transform:scale(.96)}
.nav-btn.plain{padding:0 12px}
.nav-btn .ico{width:15px;height:15px;stroke-width:2}

.profile{display:flex;align-items:center;gap:15px;margin-top:18px}
.avatar{
  position:relative;
  flex:none;
  width:66px;height:66px;
  padding:0;
  border-radius:23px;
  overflow:hidden;
  display:grid;
  place-items:center;
  font-size:26px;
  font-weight:600;
  color:#fff;
  background:linear-gradient(140deg,#FFC98B 0%,#FF9070 46%,#BB8CFF 100%);
  background-size:cover;
  background-position:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3), 0 10px 24px -12px rgba(0,0,0,.9);
  cursor:pointer;
  transition:transform .15s var(--ease);
}
.avatar:active{transform:scale(.97)}
.avatar .cam{
  position:absolute;
  right:4px;bottom:4px;
  width:22px;height:22px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(17,17,26,.72);
  color:#fff;
  border:1px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
}
.avatar .cam .ico{width:12px;height:12px;stroke-width:2}

.confirm-text{
  margin:0;
  font-size:13.5px;
  line-height:1.7;
  color:var(--ink-2);
}
.who{min-width:0}
.who h1{
  margin:0;
  font-size:21px;
  font-weight:650;
  letter-spacing:.2px;
  display:flex;
  align-items:baseline;
  gap:7px;
}
.who h1 em{font-style:normal;font-size:12.5px;font-weight:450;color:rgba(255,255,255,.62)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{
  display:inline-flex;
  align-items:center;
  height:22px;
  padding:0 8px;
  border-radius:7px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.08);
  font-size:11.5px;
  font-weight:500;
  color:rgba(255,255,255,.88);
  white-space:nowrap;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin-top:20px;
  padding:12px 4px;
  border-radius:16px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.09);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}
.stat{padding:0 14px;min-width:0}
.stat + .stat{border-left:1px solid rgba(255,255,255,.12)}
.stat span{font-size:10.5px;letter-spacing:.4px;color:rgba(255,255,255,.55)}
.stat strong{
  display:block;
  margin-top:4px;
  font-size:15px;
  font-weight:650;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.stat strong.neg{color:#FFA79E}

/* ============ 快捷操作 ============ */
.dock{
  position:relative;
  z-index:3;
  display:flex;
  gap:10px;
  margin:-30px 16px 0;
}
.qa{
  flex:1;
  padding:10px 4px 9px;
  border-radius:16px;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  font-size:11.5px;
  font-weight:550;
  color:var(--ink-2);
  box-shadow:0 6px 18px -10px rgba(21,21,27,.5), 0 1px 2px rgba(21,21,27,.06);
  transition:transform .16s var(--ease), box-shadow .2s;
}
.qa:active{transform:scale(.965)}
.qa-ico{
  width:30px;height:30px;
  border-radius:10px;
  display:grid;
  place-items:center;
}
.qa-ico.blue{background:rgba(91,91,214,.1);color:#5B5BD6}
.qa-ico.green{background:rgba(18,161,80,.1);color:#12A150}
.qa-ico.amber{background:rgba(230,145,20,.13);color:#C87A0A}

/* ============ Tab ============ */
.tabs{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin:14px 16px 0;
  padding:4px;
  border-radius:15px;
  background:#E8E9F1;
  flex:none;
}
.tab-thumb{
  position:absolute;
  top:4px;left:4px;
  width:calc((100% - 8px) / 3);
  height:calc(100% - 8px);
  border-radius:11px;
  background:#fff;
  box-shadow:0 1px 3px rgba(21,21,27,.12);
  transition:transform .38s var(--ease);
}
.tab{
  position:relative;
  z-index:1;
  height:36px;
  border-radius:11px;
  font-size:13px;
  font-weight:550;
  color:var(--muted);
  transition:color .25s;
}
.tab.is-active{color:var(--ink);font-weight:650}

/* ============ 滚动区 ============ */
.scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  overflow-anchor:none;
  padding:14px 16px 34px;
  scrollbar-width:none;
}
.scroll::-webkit-scrollbar{width:0}

.pane{display:none}
.pane.is-active{display:block;animation:paneIn .3s var(--ease) both}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 卡片 ============ */
.card{
  background:var(--card);
  border:1px solid rgba(21,21,27,.05);
  border-radius:18px;
  box-shadow:var(--shadow);
  margin-bottom:13px;
  overflow:hidden;
}
.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px 16px 10px;
}
.card-head h2{
  margin:0;
  font-size:14.5px;
  font-weight:650;
  letter-spacing:.2px;
}
.card-head .hint{font-size:11px;color:var(--muted);white-space:nowrap}

.rows{padding-bottom:2px}
.row{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:11px 16px;
  min-height:46px;
  border-top:1px solid var(--line);
  background:none;
  text-align:left;
  transition:background .15s;
}
.rows .row:first-child{border-top:none}
button.row{cursor:pointer}
button.row:active{background:#F8F8FC}
.row .label{
  flex:none;
  min-width:66px;
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}
.row .value{
  flex:1;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  align-items:center;
  justify-content:flex-end;
  text-align:right;
  font-size:14.5px;
  font-weight:550;
  line-height:1.45;
  color:var(--ink);
  word-break:break-word;
}
.row .value .meta{font-size:12px;font-weight:500;color:var(--muted)}
.row .empty{color:#B9B9C4;font-weight:500}
.chev{width:13px;height:13px;flex:none;color:#C9C9D4}

.block-soft{width:100%;height:42px;border-radius:12px;margin-top:2px}
.map-row{padding:0;gap:0}
.map-row .row-main{
  flex:1;min-width:0;display:flex;align-items:center;gap:10px;
  padding:11px 0 11px 16px;background:none;text-align:left;
}
.map-row .row-main:active{background:#F8F8FC}
.map-btn{width:44px;align-self:stretch;display:grid;place-items:center;color:#12A150}
.map-btn:active{background:rgba(18,161,80,.08)}
.map-btn .ico{width:17px;height:17px}

.rem-row{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:12px 14px;border-radius:12px;background:#F7F7FC;
  text-align:left;
}
.rem-row + .rem-row{margin-top:8px}
.rem-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rem-main b{font-size:14px;font-weight:600;color:var(--ink)}
.rem-main span{font-size:11.5px;color:var(--muted)}
.rem-days{font-size:12px;font-weight:650;color:var(--accent);white-space:nowrap}

.family-row{padding:0;gap:0}
.family-row .row-main{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 0 11px 16px;
  background:none;
  text-align:left;
}
.family-row .row-main:active{background:#F8F8FC}
.link-btn{
  width:44px;
  align-self:stretch;
  display:grid;
  place-items:center;
  color:var(--accent);
  font-size:15px;
  font-weight:700;
}
.link-btn:active{background:rgba(91,91,214,.08)}

.chip-tag{
  display:inline-flex;
  align-items:center;
  height:23px;
  padding:0 8px;
  border-radius:7px;
  background:#F1F1F7;
  color:#4C4C5A;
  font-size:12px;
  font-weight:550;
  white-space:nowrap;
}
.chip-tag.danger{background:rgba(229,72,77,.09);color:#D63A3F}
.badge-soft{
  display:inline-flex;
  align-items:center;
  height:20px;
  padding:0 7px;
  border-radius:6px;
  background:rgba(91,91,214,.09);
  color:#4F4FC7;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.2px;
  font-variant-numeric:tabular-nums;
}
.mask-pill{
  display:inline-flex;
  align-items:center;
  height:24px;
  padding:0 8px;
  border-radius:7px;
  background:#F2F2F8;
  color:#2C2C39;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;
  font-weight:500;
  letter-spacing:.04em;
  white-space:nowrap;
}
.mask-pill.is-revealed{
  background:rgba(91,91,214,.09);
  color:#4444BE;
}

.ghost-btn{
  display:inline-flex;
  align-items:center;
  gap:4px;
  height:26px;
  padding:0 7px 0 5px;
  border-radius:8px;
  color:var(--accent);
  font-size:12px;
  font-weight:600;
  transition:background .2s;
}
.ghost-btn:hover{background:rgba(91,91,214,.08)}
.ghost-btn .ico{width:15px;height:15px}

.add-row{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:12px 16px;
  border-top:1px solid var(--line);
  background:linear-gradient(#FCFCFE,#F7F7FB);
  color:var(--accent);
  font-size:13px;
  font-weight:600;
  transition:background .2s;
}
.add-row:hover{background:#F1F1F9}
.add-row .ico{width:14px;height:14px;stroke-width:2.1}

.footnote{
  display:flex;
  align-items:center;
  gap:5px;
  margin:0;
  padding:9px 16px 12px;
  border-top:1px solid var(--line);
  background:#FCFCFE;
  font-size:10.5px;
  color:var(--muted);
}
.footnote .ico{width:13px;height:13px;stroke-width:1.9}
.tip{
  margin:0;
  padding:0 16px 12px;
  font-size:10.5px;
  line-height:1.6;
  color:var(--muted);
}

/* ============ 账本 ============ */
.ledger-sum{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin:2px 16px 12px;
  padding:10px 4px;
  border-radius:13px;
  background:linear-gradient(135deg,#F7F7FC,#F1F1F8);
}
.ledger-sum div{text-align:center;min-width:0}
.ledger-sum div + div{border-left:1px solid rgba(21,21,27,.07)}
.ledger-sum span{display:block;font-size:10.5px;color:var(--muted);margin-bottom:3px}
.ledger-sum b{
  font-size:12.5px;
  font-weight:650;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.ledger-sum b.pos{color:var(--income)}
.ledger-sum b.neg{color:var(--expense)}

.timeline{list-style:none;margin:0;padding:2px 16px 4px}
.tl-item{
  position:relative;
  padding:0 16px 16px 22px;
  display:flex;
  align-items:flex-start;
  gap:8px;
}
.tl-item::before{
  content:"";
  position:absolute;
  left:5px;top:17px;bottom:0;
  width:1.5px;
  background:#EDEDF4;
}
.tl-item:last-child::before{display:none}
.tl-item:last-child{padding-bottom:6px}
.tl-dot{
  position:absolute;
  left:0;top:6px;
  width:11px;height:11px;
  border-radius:50%;
  background:#fff;
  border:2.5px solid var(--expense);
  box-shadow:0 0 0 3px rgba(229,72,77,.1);
}
.tl-dot.in{border-color:var(--income);box-shadow:0 0 0 3px rgba(18,161,80,.1)}
.tl-body{flex:1;min-width:0;text-align:left}
.tl-date{
  font-size:10.5px;
  color:var(--muted);
  letter-spacing:.3px;
  font-variant-numeric:tabular-nums;
}
.tl-title{
  margin:2px 0 0;
  font-size:14px;
  font-weight:550;
  line-height:1.4;
}
.tl-amount{
  display:inline-block;
  margin-top:3px;
  font-size:14px;
  font-weight:650;
  font-variant-numeric:tabular-nums;
}
.tl-amount.in{color:var(--income)}
.tl-amount.out{color:var(--expense)}
.tl-chev{position:absolute;right:0;top:4px}
.tl-empty{
  padding:22px 4px 26px;
  text-align:center;
  font-size:12.5px;
  color:var(--muted);
}

/* ============ 底部弹层 ============ */
.backdrop{
  position:absolute;
  inset:0;
  z-index:19;
  background:rgba(12,12,20,.36);
  -webkit-backdrop-filter:blur(1.5px);
  backdrop-filter:blur(1.5px);
  opacity:0;
  pointer-events:none;
  transition:opacity .3s;
}
.backdrop.is-open{opacity:1;pointer-events:auto}

.sheet{
  position:absolute;
  left:0;right:0;bottom:0;
  z-index:20;
  max-height:88%;
  overflow-y:auto;
  padding:7px 18px calc(20px + env(safe-area-inset-bottom));
  border-radius:26px 26px 0 0;
  background:#fff;
  box-shadow:0 -24px 60px rgba(0,0,0,.3);
  transform:translateY(112%);
  transition:transform .44s var(--ease);
  display:flex;
  flex-direction:column;
  gap:13px;
  scrollbar-width:none;
}
.sheet::-webkit-scrollbar{width:0}
.sheet.is-open{transform:translateY(0)}
.grab{
  width:38px;height:4.5px;
  border-radius:99px;
  background:#E0E0E9;
  margin:0 auto 4px;
  flex:none;
}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h2{margin:0;font-size:17px;font-weight:650}
.icon-btn{
  width:30px;height:30px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#F2F2F7;
  color:#6C6C79;
}
.icon-btn:hover{background:#E8E8F0}
.icon-btn .ico{width:14px;height:14px;stroke-width:2}
.sheet-body{display:flex;flex-direction:column;gap:13px}
.sheet-body > .field:only-child > .field-label{display:none}
.sheet-actions{display:flex;gap:10px;margin-top:2px}
.sheet-actions .btn{flex:1;height:44px;border-radius:12px;font-size:14.5px}
.btn{
  height:34px;
  padding:0 15px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  transition:transform .15s, background .2s;
}
.btn:active{transform:scale(.98)}
.btn-quiet{background:#F2F2F7;color:var(--ink-2)}
.btn-quiet:hover{background:#E9E9F1}
.btn-primary{
  background:linear-gradient(135deg,#5B5BD6,#8A63E8);
  color:#fff;
  box-shadow:0 6px 16px -8px rgba(91,91,214,.9);
}
.btn-danger{
  width:100%;
  height:42px;
  border-radius:12px;
  background:rgba(229,72,77,.08);
  color:#D63A3F;
  font-size:13.5px;
  font-weight:600;
}
.btn-danger:hover{background:rgba(229,72,77,.14)}
.btn-danger-solid{
  background:linear-gradient(135deg,#E5484D,#F0666A) !important;
  color:#fff !important;
  box-shadow:0 6px 16px -8px rgba(229,72,77,.9) !important;
}

/* ============ 表单 ============ */
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.text-input,.date-input{
  height:44px;
  width:100%;
  padding:0 12px;
  border:1px solid #E5E5EE;
  border-radius:12px;
  background:#FBFBFE;
  font-family:inherit;
  font-size:14.5px;
  color:var(--ink);
  outline:none;
  appearance:none;
  transition:border-color .2s, background .2s;
}
.text-input:focus,.date-input:focus{border-color:#A99BF5;background:#fff}
.text-input::placeholder{color:#B4B4C0}
.date-input{color:var(--ink-2);font-size:13.5px;font-variant-numeric:tabular-nums}
select.text-input{color:var(--ink-2)}

.seg{
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:1fr;
  gap:4px;
  padding:4px;
  border-radius:13px;
  background:#F1F1F7;
}
.seg-btn{
  height:34px;
  border-radius:10px;
  font-size:13.5px;
  font-weight:600;
  color:var(--muted);
  transition:background .25s, color .2s, box-shadow .25s;
}
.seg-btn.is-active{
  background:#fff;
  color:var(--ink);
  box-shadow:0 1px 3px rgba(21,21,27,.12);
}
.seg[data-dir] .seg-btn[data-v="支出"].is-active{color:var(--expense)}
.seg[data-dir] .seg-btn[data-v="收入"].is-active{color:var(--income)}

.tag-editor{display:flex;flex-wrap:wrap;gap:7px;min-height:24px;align-items:center}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  height:27px;
  padding:0 6px 0 10px;
  border-radius:8px;
  background:#F1F1F7;
  font-size:12.5px;
  color:#4C4C5A;
}
.tag button{
  width:16px;height:16px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(0,0,0,.06);
  color:#7A7A88;
  font-size:10px;
  line-height:1;
}
.tag-add{display:flex;gap:8px}
.tag-add .text-input{flex:1;height:38px}
.tag-add .btn{height:38px;flex:none}

.switch-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);cursor:pointer}
.switch-row input{display:none}
.switch-row i{
  width:40px;height:24px;
  border-radius:99px;
  background:#E3E3EC;
  position:relative;
  transition:background .22s;
  flex:none;
}
.switch-row i::after{
  content:"";
  position:absolute;
  left:3px;top:3px;
  width:18px;height:18px;
  border-radius:50%;
  background:#fff;
  transition:transform .22s;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.switch-row input:checked + i{background:#5B5BD6}
.switch-row input:checked + i::after{transform:translateX(16px)}

.amount-box{
  display:flex;
  align-items:baseline;
  gap:6px;
  height:58px;
  padding:0 14px;
  border-radius:14px;
  background:#F7F7FC;
  border:1.5px solid transparent;
  transition:border-color .2s, background .2s;
}
.amount-box:focus-within{border-color:#A99BF5;background:#fff}
.amount-box .cny{font-size:19px;font-weight:600;color:var(--muted)}
.amount-box input{
  flex:1;
  min-width:0;
  border:none;
  outline:none;
  background:none;
  font-family:inherit;
  font-size:30px;
  font-weight:650;
  letter-spacing:.5px;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.amount-box input::placeholder{color:#C7C7D3}
.amount-box input::-webkit-outer-spin-button,
.amount-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ============ Toast ============ */
.toast{
  position:absolute;
  top:12px;
  left:50%;
  z-index:30;
  transform:translate(-50%,-16px);
  max-width:84%;
  padding:8px 14px;
  border-radius:11px;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.6);
  background:rgba(21,21,27,.9);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  color:#fff;
  font-size:12px;
  font-weight:500;
  line-height:1.4;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .26s, transform .26s var(--ease);
}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

/* ============ 响应式 ============ */
@media (max-width:560px){
  body{padding:0;display:block;place-items:normal;background:var(--bg)}
  .stage{width:100%;gap:0}
  .phone{
    width:100%;
    height:100dvh;
    border-radius:0;
    box-shadow:none;
  }
  .caption{display:none}
  .statusbar{display:none}
  .hero{padding-top:calc(10px + env(safe-area-inset-top))}
  .list-head{padding-top:calc(10px + env(safe-area-inset-top))}
  .scroll{padding-bottom:calc(34px + env(safe-area-inset-bottom))}
  .list-scroll{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">

  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16"/><path d="M10.4 6.7A10.6 10.6 0 0 1 12 6.5c6 0 9.5 5.5 9.5 5.5a17.6 17.6 0 0 1-3.6 4.1"/><path d="M6.7 8.4A17 17 0 0 0 2.5 12S6 17.5 12 17.5c1.3 0 2.4-.2 3.5-.7"/></symbol>

  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s6.5-6.1 6.5-11a6.5 6.5 0 0 0-13 0C5.5 14.9 12 21 12 21z"/><circle cx="12" cy="10" r="2.4"/></symbol>

</svg>

<div class="stage">
  <div class="phone" id="phone">

    <!-- ==================== 通讯录列表 ==================== -->
    <section class="screen screen-list" id="listScreen" aria-label="通讯录">
      <header class="list-head">
        <div class="statusbar">
          <span>9:41</span>
          <span class="sb-right"><span class="sb-5g">5G</span><span class="battery" aria-hidden="true"></span></span>
        </div>
        <div class="list-head-row">
          <div>
            <h1>通讯录</h1>
            <p id="listCount">8 位好友</p>
          </div>
          <button class="round-btn" type="button" data-add="contact" aria-label="新建联系人">
            <svg class="ico"><use href="#i-plus"/></svg>
          </button>
        </div>
        <label class="search">
          <svg class="ico"><use href="#i-search"/></svg>
          <input id="searchInput" type="search" placeholder="搜索姓名、公司或标签" autocomplete="off">
        </label>
      </header>

      <div class="list-scroll" id="listScroll">
        <div id="listGroups"></div>
        <p class="list-empty" id="listEmpty" hidden>没有找到相关联系人</p>
      </div>
      <div class="index-bar" id="indexBar" aria-hidden="true"></div>
    </section>

    <!-- ==================== 联系人详情 ==================== -->
    <section class="screen screen-detail" id="detailScreen" aria-label="联系人详情" aria-hidden="true">
      <header class="hero">
        <div class="statusbar">
          <span>9:41</span>
          <span class="sb-right"><span class="sb-5g">5G</span><span class="battery" aria-hidden="true"></span></span>
        </div>

        <div class="nav">
          <button class="nav-btn" type="button" data-back aria-label="返回通讯录">
            <svg class="ico"><use href="#i-back"/></svg>
            通讯录
          </button>
          <button class="nav-btn plain" type="button" id="editContactBtn">编辑</button>
        </div>

        <div class="profile">
          <button class="avatar" id="heroAvatar" type="button" aria-label="更换头像">
            <span id="heroInitial">王</span>
            <span class="cam" aria-hidden="true"><svg class="ico"><use href="#i-camera"/></svg></span>
          </button>
          <div class="who">
            <h1 id="heroName">王小明 <em>老王</em></h1>
            <div class="chips" id="heroTags"></div>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><span>往来净额</span><strong id="heroNet">¥0.00</strong></div>
          <div class="stat"><span>往来记录</span><strong id="heroCount">0 笔</strong></div>
          <div class="stat"><span>认识</span><strong id="heroDays">—</strong></div>
        </div>
      </header>

      <div class="dock">
        <button class="qa" type="button" id="callBtn">
          <span class="qa-ico blue"><svg class="ico"><use href="#i-phone"/></svg></span>
          电话
        </button>
        <button class="qa" type="button" id="remindBtn">
          <span class="qa-ico amber"><svg class="ico"><use href="#i-bell"/></svg></span>
          提醒
        </button>
      </div>

      <div class="tabs" role="tablist" aria-label="联系人资料分类">
        <div class="tab-thumb" id="tabThumb" aria-hidden="true"></div>
        <button class="tab is-active" type="button" role="tab" data-tab="0" aria-selected="true">基本信息</button>
        <button class="tab" type="button" role="tab" data-tab="1" aria-selected="false" tabindex="-1">社会关系</button>
        <button class="tab" type="button" role="tab" data-tab="2" aria-selected="false" tabindex="-1">往来与资产</button>
      </div>

      <main class="scroll" id="scroll">
        <section class="pane is-active" id="pane-0" role="tabpanel"></section>
        <section class="pane" id="pane-1" role="tabpanel"></section>
        <section class="pane" id="pane-2" role="tabpanel"></section>
      </main>
    </section>

    <!-- ==================== 通用编辑弹层 ==================== -->
    <div class="backdrop" id="backdrop"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true" inert>
      <div class="grab" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle">编辑</h2>
        <button class="icon-btn" type="button" id="sheetClose" aria-label="关闭">
          <svg class="ico"><use href="#i-x"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-actions">
        <button class="btn btn-quiet" type="button" id="sheetCancel">取消</button>
        <button class="btn btn-primary" type="button" id="sheetSave">保存</button>
      </div>
      <button class="btn btn-danger" type="button" id="sheetDelete" hidden>删除</button>
    </section>

    <input type="file" id="avatarFile" accept="image/*" hidden>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  function calcAge(iso) {
    if (!iso) return null;
    const b = new Date(iso + 'T00:00:00');
    if (isNaN(b)) return null;
    const t = new Date();
    let age = t.getFullYear() - b.getFullYear();
    const m = t.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && t.getDate() < b.getDate())) age--;
    return age;
  }
  function zodiacOf(iso) {

    if (isNaN(b)) return null;
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const next = new Date(t.getFullYear(), b.getMonth(), b.getDate());
    if (next < t) next.setFullYear(t.getFullYear() + 1);
    return Math.round((next - t) / 86400000);
  }

  function lunarOf(date) {
    if (!lunarFmt) return { month: '', day: 0 };
    let month = '', day = 0;
    lunarFmt.formatToParts(date).forEach(part => {
      if (part.type === 'month') month = part.value;
      if (part.type === 'day') day = Number(part.value);
    });
    return { month: month, day: day };
  }

  // 距离下一次农历某月某日还有几天（最多找 400 天）
  function daysToLunar(monthName, dayNum) {
    if (!monthName || !dayNum) return null;
    const start = new Date();
    start.setHours(12, 0, 0, 0);
    for (let i = 0; i <= 400; i++) {
      const d = new Date(start.getTime() + i * 86400000);
      const l = lunarOf(d);
      if (l.month === monthName && l.day === dayNum) return i;
    }
    return null;
  }

  function daysToMonthDay(iso) {
    const src = new Date(iso + 'T00:00:00');
    if (isNaN(src)) return null;
    const t = new Date();
    t.setHours(0, 0, 0, 0);
    const next = new Date(t.getFullYear(), src.getMonth(), src.getDate());
    if (next < t) next.setFullYear(t.getFullYear() + 1);
    return Math.round((next - t) / 86400000);
  }

  function reminderDays(r) {
    if (!r) return null;
    if (r.calendar === 'lunar') return daysToLunar(r.lunarMonth, Number(r.lunarDay));
    return r.date ? daysToMonthDay(r.date) : null;
  }

  function reminderWhen(r) {
    if (!r) return '';
    if (r.calendar === 'lunar') {

      return '农历 ' + (r.lunarMonth || '') + (LUNAR_DAYS[d - 1] || '');
    }
    return r.date || '';

    const t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.max(0, Math.round((t - from) / 86400000));

  /* ================= 列表左滑：编辑 / 删除 ================= */
  let swipeOpen = null;
  let swipeDrag = null;
  let swipeSuppress = false;

  function resetSwipe(wrap) {
    if (!wrap) return;
    const actions = wrap.querySelector('.c-actions');
    if (actions) actions.style.transform = '';
    wrap.classList.remove('dragging');
    wrap.dataset.open = '0';
    if (swipeOpen === wrap) swipeOpen = null;
    if (!swipeOpen) $('#listScreen').classList.remove('swiping');
  }

  function closeSwipes() {
    if (swipeOpen) resetSwipe(swipeOpen);
  }

  $('#listGroups').addEventListener('pointerdown', (e) => {
    const row = e.target.closest('.c-row');
    if (!row || e.target.closest('.c-act')) return;
    const wrap = row.closest('.c-swipe');
    if (!wrap) return;
    if (swipeOpen && swipeOpen !== wrap) resetSwipe(swipeOpen);
    const base = wrap.dataset.open === '1' ? -144 : 0;
    const actions = wrap.querySelector('.c-actions');
    swipeDrag = { wrap: wrap, actions: actions, startX: e.clientX, base: base, value: base, moved: false };
    wrap.classList.add('dragging');
    if (actions) actions.style.transform = 'translateX(' + (144 + base) + 'px)';
  });

  $('#listGroups').addEventListener('pointermove', (e) => {
    if (!swipeDrag) return;
    const dx = e.clientX - swipeDrag.startX;
    if (Math.abs(dx) > 4) swipeDrag.moved = true;
    let v = swipeDrag.base + dx;
    if (v > 0) v = 0;
    if (v < -144) v = -144 + (v + 144) * 0.18;
    swipeDrag.value = v;
    if (swipeDrag.actions) swipeDrag.actions.style.transform = 'translateX(' + (144 + v) + 'px)';
  });

  function endSwipe() {
    if (!swipeDrag) return;
    const drag = swipeDrag;
    swipeDrag = null;
    const open = drag.value < -60;
    drag.wrap.classList.remove('dragging');
    drag.wrap.dataset.open = open ? '1' : '0';
    if (drag.actions) drag.actions.style.transform = open ? 'translateX(0px)' : '';
    if (open) {
      swipeOpen = drag.wrap;
      $('#listScreen').classList.add('swiping');
    } else if (swipeOpen === drag.wrap) {
      swipeOpen = null;
      $('#listScreen').classList.remove('swiping');
    }
    swipeSuppress = drag.moved;
    setTimeout(() => { swipeSuppress = false; }, 320);
  }

  $('#listGroups').addEventListener('contextmenu', (e) => e.preventDefault());
  $('#listGroups').addEventListener('pointerup', endSwipe);
  $('#listGroups').addEventListener('pointercancel', endSwipe);
  $('#listGroups').addEventListener('pointerleave', endSwipe);

      tab.setAttribute('aria-selected', String(on));
      tab.tabIndex = on ? 0 : -1;

    $$('.pane').forEach((pane, k) => pane.classList.toggle('is-active', k === i));

    if (resetScroll !== false) $('#scroll').scrollTop = 0;

      e.preventDefault();

      switchTab(next);

  /* ================= 通用弹层 ================= */
  let sheetCtx = null;

  function openSheet(cfg) {
    sheetCtx = cfg;
    $('#sheetTitle').textContent = cfg.title || '编辑';
    $('#sheetBody').innerHTML = cfg.body || '';
    $('#sheetDelete').hidden = !cfg.del;
    $('#sheetDelete').textContent = cfg.delText || '删除';
    $('#sheetSave').textContent = cfg.saveText || '保存';
    $('#sheetSave').classList.toggle('btn-danger-solid', !!cfg.danger);

    const sheet = $('#sheet');
    sheet.inert = false;
    sheet.classList.add('is-open');
    sheet.setAttribute('aria-hidden', 'false');
    $('#backdrop').classList.add('is-open');
    syncNativeBack();

    if (cfg.init) cfg.init();
    setTimeout(() => {
      const f = $('#sheetBody input, #sheetBody textarea');
      if (f) f.focus();
    }, 320);
  }

  function closeSheet() {
    const sheet = $('#sheet');
    sheet.classList.remove('is-open');
    sheet.setAttribute('aria-hidden', 'true');
    sheet.inert = true;
    $('#backdrop').classList.remove('is-open');
    if (sheet.contains(document.activeElement)) document.activeElement.blur();
    sheetCtx = null;
    syncNativeBack();
  }

  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheetCancel').addEventListener('click', closeSheet);
  $('#backdrop').addEventListener('click', closeSheet);

  $('#sheetSave').addEventListener('click', () => {
    if (!sheetCtx || !sheetCtx.save) return;
    const ok = sheetCtx.save();
    if (ok !== false) closeSheet();
  });

  $('#sheetDelete').addEventListener('click', () => {
    if (!sheetCtx || !sheetCtx.del) return;
    sheetCtx.del();
    closeSheet();
  });

  /* ================= 表单片段 ================= */
  function textField(label, key, value, placeholder, type) {
    return '<label class="field"><span class="field-label">' + label + '</span>' +
      '<input class="' + (type === 'date' ? 'date-input' : 'text-input') + '" data-k="' + key + '" type="' +
      (type === 'date' ? 'date' : 'text') + '" value="' + esc(value || '') + '" placeholder="' +
      esc(placeholder || '') + '" autocomplete="off"></label>';
  }

  function selectField(label, key, value, options) {
    return '<label class="field"><span class="field-label">' + label + '</span>' +
      '<select class="text-input" data-k="' + key + '">' +
        options.map(o => '<option value="' + esc(o) + '"' + (o === value ? ' selected' : '') + '>' +
          esc(o) + '</option>').join('') +
      '</select></label>';
  }

  function segField(label, key, value, options, dirAttr) {
    return '<div class="field"><span class="field-label">' + label + '</span>' +
      '<div class="seg"' + (dirAttr ? ' data-dir="1"' : '') + ' data-k="' + key + '">' +
        options.map(o => '<button class="seg-btn' + (o === value ? ' is-active' : '') +
          '" type="button" data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') +
      '</div></div>';
  }

  function tagsField(label, placeholder) {
    return '<div class="field"><span class="field-label">' + label + '</span>' +
      '<div class="tag-editor" id="tagEditor"></div>' +
      '<div class="tag-add">' +
        '<input class="text-input" id="tagInput" type="text" placeholder="' + esc(placeholder) + '" autocomplete="off">' +
        '<button class="btn btn-quiet" type="button" id="tagAddBtn">添加</button>' +
      '</div></div>';
  }

  function switchField(label, key, checkedVal, hint) {
    return '<div class="field"><span class="field-label">' + label + '</span>' +
      '<label class="switch-row"><input type="checkbox" data-k="' + key + '"' + (checkedVal ? ' checked' : '') + '><i></i>' +
      '<span>' + esc(hint || '') + '</span></label></div>';
  }

  function bindSegs() {
    $$('#sheetBody .seg').forEach(seg => {
      seg.addEventListener('click', (e) => {
        const b = e.target.closest('.seg-btn');
        if (!b) return;
        $$('.seg-btn', seg).forEach(x => x.classList.toggle('is-active', x === b));
      });
    });
  }

  const segValue = (key) => {
    const seg = $('#sheetBody .seg[data-k="' + key + '"]');
    const b = seg && seg.querySelector('.seg-btn.is-active');
    return b ? b.dataset.v : '';
  };

  const val = (key) => {
    const el = $('#sheetBody [data-k="' + key + '"]');
    return el ? el.value.trim() : '';
  };

  const isChecked = (key) => {
    const el = $('#sheetBody [data-k="' + key + '"]');
    return !!(el && el.checked);
  };

  /* 标签编辑器 */
  let tagState = [];
  function mountTags(initial) {
    tagState = (initial || []).slice();
    const ed = $('#tagEditor');
    if (!ed) return;

    const draw = () => {
      ed.innerHTML = tagState.length
        ? tagState.map((t, i) =>
            '<span class="tag">' + esc(t) +
            '<button type="button" data-tag="' + i + '" aria-label="移除">✕</button></span>').join('')
        : '<span style="font-size:12px;color:#B4B4C0">还没有添加</span>';
    };
    draw();

    ed.addEventListener('click', (e) => {
      const b = e.target.closest('[data-tag]');
      if (!b) return;
      tagState.splice(Number(b.dataset.tag), 1);
      draw();
    });

    const input = $('#tagInput');
    const add = () => {
      const v = input.value.trim();
      if (!v) return;
      if (!tagState.includes(v)) tagState.push(v);
      input.value = '';
      draw();
      input.focus();
    };
    $('#tagAddBtn').addEventListener('click', add);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); add(); }
    });
  }

  /* ================= 区域选择 ================= */
  function editRegion(key, label) {
    const c = contact();
    if (!c) return;
    const cur = getPath(c, key) || { province: '', city: '', county: '' };
    const opt = (name, sel) => '<option value="' + esc(name) + '"' + (name === sel ? ' selected' : '') + '>' + esc(name) + '</option>';

    openSheet({
      title: label,
      body:
        '<div class="field"><span class="field-label">省 / 直辖市</span>' +
          '<select class="text-input" data-k="province"><option value="">请选择</option>' +
          REGIONS.map(p => opt(p.name, cur.province)).join('') + '</select></div>' +
        '<div class="field"><span class="field-label">市</span>' +
          '<select class="text-input" data-k="city"><option value="">请选择</option></select></div>' +
        '<div class="field"><span class="field-label">区 / 县</span>' +
          '<select class="text-input" data-k="county"><option value="">请选择</option></select></div>',
      init: () => {
        const ps = $('#sheetBody [data-k="province"]');
        const cs = $('#sheetBody [data-k="city"]');
        const ds = $('#sheetBody [data-k="county"]');
        const fillCities = (keep) => {
          const prov = REGIONS.find(x => x.name === ps.value);
          cs.innerHTML = '<option value="">请选择</option>' +
            (prov ? prov.children.map(x => opt(x.name, keep || '')).join('') : '');
        };
        const fillCounties = (keep) => {
          const prov = REGIONS.find(x => x.name === ps.value);
          const city = prov ? prov.children.find(x => x.name === cs.value) : null;
          ds.innerHTML = '<option value="">请选择</option>' +
            (city ? city.children.map(x => opt(x.name, keep || '')).join('') : '');
        };
        if (cur.province) { fillCities(cur.city); fillCounties(cur.county); }
        ps.addEventListener('change', () => { fillCities(''); fillCounties(''); });
        cs.addEventListener('change', () => fillCounties(''));
      },
      save: () => {
        const province = val('province');
        if (!province) { toast('请选择省份'); return false; }
        setPath(c, key, { province: province, city: val('city'), county: val('county') });
        commit();
      }
    });
  }

  function editReminder(id) {
    const c = contact();
    if (!c) return;
    c.reminders = c.reminders || [];
    const isNew = !id;
    const r = isNew
      ? { type: '生日', calendar: 'solar', date: (c.profile && c.profile.birthday) || todayISO(), note: '' }
      : c.reminders.find(x => x.id === id);
    if (!r) return;
    const types = ['生日', '认识纪念日', '结婚纪念日', '自定义'];
    const cal = r.calendar === 'lunar' ? '农历' : '公历';
    const nowLunar = lunarOf(new Date());
    const lmonth = r.lunarMonth || nowLunar.month || '正月';
    const lday = Number(r.lunarDay) || nowLunar.day || 1;

    const monthOpts = LUNAR_MONTHS.map(m =>
      '<option value="' + m + '"' + (m === lmonth ? ' selected' : '') + '>' + m + '</option>').join('');
    const dayOpts = LUNAR_DAYS.map((d, i) =>
      '<option value="' + (i + 1) + '"' + ((i + 1) === lday ? ' selected' : '') + '>' + d + '</option>').join('');

    const body =
      selectField('提醒项目', 'type', r.type || '生日', types) +
      segField('日期类型', 'cal', cal, ['公历', '农历']) +
      '<div class="field" data-cal="solar"><span class="field-label">公历日期</span>' +
        '<input class="date-input" data-k="date" type="date" value="' + esc(r.date || todayISO()) + '"></div>' +
      '<div class="field" data-cal="lunar"><span class="field-label">农历月</span>' +
        '<select class="text-input" data-k="lmonth">' + monthOpts + '</select></div>' +
      '<div class="field" data-cal="lunar"><span class="field-label">农历日</span>' +
        '<select class="text-input" data-k="lday">' + dayOpts + '</select></div>' +
      textField('备注', 'note', r.note, '如：提前 3 天');

    const toggle = () => {
      const isLunar = segValue('cal') === '农历';
      $$('#sheetBody [data-cal]').forEach(el => {
        el.style.display = (el.dataset.cal === (isLunar ? 'lunar' : 'solar')) ? '' : 'none';
      });
    };

    openSheet({
      title: isNew ? '添加提醒' : '提醒',
      body: body,
      init: () => {
        bindSegs();
        toggle();
        const seg = $('#sheetBody .seg[data-k="cal"]');
        if (seg) seg.addEventListener('click', toggle);
      },
      save: () => {
        const isLunar = segValue('cal') === '农历';
        let data;
        if (isLunar) {
          data = { calendar: 'lunar', lunarMonth: val('lmonth'), lunarDay: Number(val('lday')), note: val('note') };
        } else {
          const date = val('date');
          if (!date) { toast('请选择日期'); return false; }
          data = { calendar: 'solar', date: date, note: val('note') };
        }
        if (isNew) {
          c.reminders.push(Object.assign({ id: uid('r'), type: val('type') }, data));
        } else {
          r.type = val('type');
          Object.assign(r, data);
        }
        commit();
      },
      del: isNew ? null : () => {
        c.reminders = c.reminders.filter(x => x.id !== id);
        commit();
      }
    });
  }

  function openReminderList() {
    const c = contact();
    if (!c) return;

  /* ================= 字段编辑 ================= */
  function editField(key, label) {
    const c = contact();
    if (!c) return;
    const meta = FIELD_META[key];
    if (!meta) return;
    const v = getPath(c, key);

    if (key === 'phone') {
      openSheet({
        title: label,
        body: textField('手机号', 'v', v, '如：138 0013 8000') +
          '<button class="btn btn-quiet block-soft" type="button" id="pickPhoneBtn">从手机通讯录选择</button>',
        init: () => {
          const btn = $('#pickPhoneBtn');
          if (btn) btn.addEventListener('click', () => {
            if (window.friendbookNative && window.friendbookNative.pickPhone) {
              window.friendbookNative.pickPhone();
            } else {
              toast('请在手机 App 内使用');
            }
          });
        },
        save: () => { setPath(c, key, val('v')); commit(); }
      });
      return;
    }

    if (meta.type === 'country') {
      openSheet({
        title: label,
        body: selectField('国家 / 地区', 'v', c.nationality || '中国', COUNTRIES),
        save: () => { c.nationality = val('v'); commit(); }
      });
      return;
    }

    if (meta.type === 'ethnic') {
      const cn = (c.nationality || '中国') === '中国';
      const body = cn
        ? selectField('民族', 'pick', (c.profile && c.profile.ethnicity) || '汉族', CN_ETHNIC.concat(['其他']))
          + textField('自定义', 'custom', '', '不在列表里？直接填写')
        : textField('民族', 'custom', (c.profile && c.profile.ethnicity) || '', '如：华人 / 其他');
      openSheet({
        title: label,
        body: body,
        save: () => {
          const custom = val('custom');
          const pick = cn ? val('pick') : '';
          const value = custom || (pick === '其他' ? '' : pick);
          if (!value) { toast('请选择或填写民族'); return false; }
          c.profile.ethnicity = value;
          commit();
        }
      });
      return;
    }

    if (meta.type === 'region') {
      editRegion(key, label);
      return;
    }

    if (meta.type === 'tags') {
      openSheet({
        title: label,
        body: tagsField(label, meta.placeholder || '输入后回车添加'),
        init: () => mountTags(v || []),
        save: () => { setPath(c, key, tagState.slice()); commit(); }
      });
      return;
    }

    if (meta.type === 'segment') {
      openSheet({
        title: label,
        body: segField(label, 'v', v || meta.options[0], meta.options),
        init: bindSegs,
        save: () => {
          const nv = segValue('v');
          if (!nv) return false;
          setPath(c, key, nv);
          commit();
        }
      });
      return;
    }

    if (meta.type === 'date') {
      openSheet({
        title: label,
        body: textField(label, 'v', v, '', 'date'),
        save: () => {
          const nv = val('v');
          if (!nv) { toast('请选择日期'); return false; }
          setPath(c, key, nv);
          commit();
        }
      });
      return;
    }

    openSheet({
      title: label,
      body: textField(label, 'v', v, meta.placeholder || ''),
      save: () => { setPath(c, key, val('v')); commit(); }
    });
  }

  function editLedger(id) {
    const c = contact();
    if (!c) return;
    c.ledger = c.ledger || [];
    const isNew = !id;
    const e = isNew
      ? { date: todayISO(), title: '', amount: '', dir: 'out' }
      : c.ledger.find(x => x.id === id);
    if (!e) return;

    const dirValue = e.dir === 'in' ? '收入' : '支出';

    openSheet({
      title: isNew ? '记一笔' : '往来记录',
      body:
        segField('类型', 'dir', dirValue, ['支出', '收入'], true) +
        '<div class="field"><span class="field-label">金额</span>' +
          '<span class="amount-box"><span class="cny" aria-hidden="true">¥</span>' +
          '<input data-k="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="' +
          (e.amount === '' || e.amount == null ? '' : e.amount) + '" aria-label="金额"></span></div>' +
        textField('事项', 'title', e.title, '如：春节给孩子红包') +
        textField('日期', 'date', e.date, '', 'date'),
      init: bindSegs,
      save: () => {
        const amount = Number(val('amount'));
        if (!val('amount') || !isFinite(amount) || amount <= 0) { toast('请填写大于 0 的金额'); return false; }
        const title = val('title') || (segValue('dir') === '收入' ? '收到人情' : '随出人情');
        const date = val('date') || todayISO();
        const dir = segValue('dir') === '收入' ? 'in' : 'out';

        if (isNew) {
          c.ledger.push({ id: uid('l'), date: date, title: title, amount: Math.round(amount * 100) / 100, dir: dir });
          toast('已记一笔');
        } else {
          e.date = date; e.title = title; e.amount = Math.round(amount * 100) / 100; e.dir = dir;
          toast('已更新');
        }
        commit();
      },
      del: isNew ? null : () => {
        c.ledger = c.ledger.filter(x => x.id !== id);
        commit();
        toast('已删除');
      }
    });
  }

  /* ================= 新增入口 ================= */
  function addThing(kind) {
    if (kind === 'family') return editFamily(null);
    if (kind === 'asset') return editAsset(null);
    if (kind === 'ledger') return editLedger(null);
    if (kind === 'contact') return addContact();
    if (kind === 'edu') return editEducation(null);
    if (kind === 'work') return editWork(null);
    if (kind === 'reminder') return editReminder(null);
  }

  function addContact() {
    openSheet({
      title: '新建联系人',
      body:
        textField('姓名', 'name', '', '姓名') +
        textField('昵称', 'nick', '', '选填'),
      save: () => {
        const name = val('name');
        if (!name) { toast('请填写姓名'); return false; }
        const first = name.slice(0, 1);
        const initial = /[A-Za-z]/.test(first) ? first.toUpperCase() : '#';
        const c = {
          id: uid('c'), name: name, nick: val('nick'), initial: initial,
          color: Math.floor(Math.random() * GRADS.length), tags: [], since: todayISO(),
          profile: {
            gender: '', birthday: '', lunar: '', ethnicity: '', hometown: '', city: '',
            hobbies: [], taboos: [], channel: '', introducer: ''
          },
          work: { job: '', company: '', school: '' },
          family: [], assets: [], ledger: []
        };
        db.contacts.push(c);
        saveDb();
        renderList();
        openContact(c.id);
        toast('已新建联系人');
      }
    });
  }

  /* ================= 快捷操作 ================= */
  $$('[data-toast]').forEach(btn => {
    btn.addEventListener('click', () => toast(btn.dataset.toast));
  });

  /* 电话：原生拉起拨号盘，浏览器退化为 tel: */
  $('#callBtn').addEventListener('click', () => {
    const c = contact();
    const phone = c && c.phone;
    if (!phone) { toast('还没有填写手机号'); return; }
    try {
      if (window.friendbookNative && window.friendbookNative.dial) {
        window.friendbookNative.dial(phone);
        return;
      }
    } catch (err) { /* 忽略 */ }
    location.href = 'tel:' + String(phone).replace(/[^0-9+]/g, '');
  });

  /* 头像：从相册选择并压缩后保存 */
  $('#heroAvatar').addEventListener('click', () => {
    if (contact()) $('#avatarFile').click();
  });

  $('#avatarFile').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        const data = canvas.toDataURL('image/jpeg', 0.82);
        const c = contact();
        if (!c) return;
        c.avatar = data;
        saveDb();
        renderDetail();
        renderList();
        toast('头像已更新');
      };
      img.onerror = () => toast('这张图片读不出来，换一张试试');
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  $('#remindBtn').addEventListener('click', () => {
    if (!contact()) return;
    openReminderList();
  });

  /* ================= 初始化 ================= */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#sheet').classList.contains('is-open')) closeSheet();
  });

  renderList();
  syncNativeBack();

  // PWA：仅在 https/localhost 下注册离线缓存，file:// 与鸿蒙 App 内自动跳过
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
